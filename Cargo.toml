[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
koda-core = { path = "crates/koda-core" }
koda-db = { path = "crates/koda-db" }
koda-decision = { path = "crates/koda-decision" }
koda-download = { path = "crates/koda-download" }
koda-indexers = { path = "crates/koda-indexers" }
koda-metadata = { path = "crates/koda-metadata" }
koda-parser = { path = "crates/koda-parser" }

reqwest = { version = "0.13", features = ["json", "gzip", "query", "form", "multipart", "cookies", "stream"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
