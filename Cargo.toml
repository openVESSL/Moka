[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/openVESSL/Moka"

[workspace.dependencies]
moka-core = { path = "crates/moka-core" }
moka-db = { path = "crates/moka-db" }
moka-decision = { path = "crates/moka-decision" }
moka-download = { path = "crates/moka-download" }
moka-indexers = { path = "crates/moka-indexers" }
moka-metadata = { path = "crates/moka-metadata" }
moka-net = { path = "crates/moka-net" }
moka-parser = { path = "crates/moka-parser" }

reqwest = { version = "0.13", features = ["json", "gzip", "query", "form", "multipart", "cookies", "stream"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
