[package]
name = "koda-server"
description = "The koda binary: HTTP API, background loop, web app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "koda"
path = "src/main.rs"

[dependencies]
koda-core.workspace = true
koda-db.workspace = true
koda-decision.workspace = true
koda-download.workspace = true
koda-indexers.workspace = true
koda-metadata.workspace = true
koda-parser.workspace = true
reqwest.workspace = true
koda-net.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
getrandom = "0.4.3"
mime_guess = "2.0.5"
rust-embed = { version = "8.14.0", features = ["interpolate-folder-path"] }
sha2 = "0.11.1"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "fs"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]

http-body-util = "0.1"

[lints]
workspace = true
