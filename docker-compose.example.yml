# Example setup. Copy to docker-compose.yml and adjust paths.
#
# Keep downloads and the library on the same volume (/data here) so imports
# can hardlink instead of copying: no extra disk space while torrents seed.
#
#   /srv/media/
#     downloads/   <- your download client saves here
#     movies/      <- library folder you choose in Settings

services:
  moka:
    # No published image yet: build it from this repository.
    build: .
    container_name: moka
    user: "1000:1000"
    ports:
      - "8484:8484"
    # Phone and TV apps made for Jellyfin connect to http://<server>:8484/jellyfin.
    # For them to find the server on their own, use the host network instead of
    # the ports above (network broadcasts do not reach a bridged container):
    # network_mode: host
    volumes:
      - ./config:/config
      - /srv/media:/data
    # Faster conversion on a graphics card (Settings > Playback):
    # Intel/AMD (VAAPI, QSV): pass the render device
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "render"   # or the numeric group id of /dev/dri/renderD128
    # NVIDIA (NVENC): needs the NVIDIA Container Toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video]
    restart: unless-stopped
